<div class="admin-page">

  <div class="page-header">
    <div>
      <h1 class="page-title">Trayectoria</h1>
      <p class="page-sub">Historia, misión, visión y valores</p>
    </div>

    <div class="header-actions">
      <button class="btn-save" (click)="save()" [disabled]="!dirty()">Guardar</button>
    </div>
  </div>

  <div class="admin-card form-card-lg">

    <div class="form-block">
      <label>Historia</label>
      <quill-editor [ngModel]="formData().history" (ngModelChange)="formData.update(f => ({ ...f, history: $event }))"
        [modules]="quillConfig" theme="snow">
      </quill-editor>
    </div>

    <div class="form-block">
      <label>Misión</label>
      <quill-editor [ngModel]="formData().mision" (ngModelChange)="formData.update(f => ({ ...f, mision: $event }))"
        [modules]="quillConfig" theme="snow">
      </quill-editor>
    </div>

    <div class="form-block">
      <label>Visión</label>
      <quill-editor [ngModel]="formData().vision" (ngModelChange)="formData.update(f => ({ ...f, vision: $event }))"
        [modules]="quillConfig" theme="snow">
      </quill-editor>
    </div>

    <div class="form-block">
      <label>Valores</label>
      <quill-editor [ngModel]="formData().values" (ngModelChange)="formData.update(f => ({ ...f, values: $event }))"
        [modules]="quillConfig" theme="snow">
      </quill-editor>
    </div>

    <div class="form-block">
      <label>Descripción adicional</label>
      <quill-editor [ngModel]="formData().description"
        (ngModelChange)="formData.update(f => ({ ...f, description: $event }))" [modules]="quillConfig" theme="snow">
      </quill-editor>
    </div>

  </div>

</div>

@if (showAviso()) {
<app-aviso-cambios
  (guardar)="onAvisoGuardar()"
  (descartar)="onAvisoDescartar()"
  (seguir)="onAvisoSeguir()" />
}
