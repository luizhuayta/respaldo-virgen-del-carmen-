<aside class="admin-sidebar">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">
      <i class="fas fa-graduation-cap"></i>
    </div>
    <div class="brand-text">
      <span class="brand-title">IESPP</span>
      <span class="brand-sub">Virgen del Carmen</span>
    </div>
  </div>

  <!-- Divider -->
  <div class="sidebar-divider"></div>

  <!-- Navigation -->
  <nav class="sidebar-nav" aria-label="Secciones del panel">
    <a class="sidebar-item" [routerLink]="dashboard.route" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }" #dashRla="routerLinkActive"
      [attr.aria-current]="dashRla.isActive ? 'page' : null">
      <i [class]="dashboard.icon" class="sidebar-icon"></i>
      <span class="sidebar-label">{{ dashboard.label }}</span>
    </a>

    @for (group of menuGroups; track group.label) {
    <h3 class="sidebar-section-label">{{ group.label }}</h3>
    @for (item of group.items; track item.route) {
    <a class="sidebar-item" [routerLink]="item.route" routerLinkActive="active"
      #rla="routerLinkActive" [attr.aria-current]="rla.isActive ? 'page' : null">
      <i [class]="item.icon" class="sidebar-icon"></i>
      <span class="sidebar-label">{{ item.label }}</span>
    </a>
    }
    }
  </nav>

  <!-- Spacer -->
  <div class="sidebar-spacer"></div>

  <!-- Divider -->
  <div class="sidebar-divider"></div>

  <!-- Footer -->
  <button class="logout-btn" (click)="logout()">
    <i class="fas fa-right-from-bracket sidebar-icon"></i>
    <span class="sidebar-label">Cerrar sesión</span>
  </button>

</aside>
