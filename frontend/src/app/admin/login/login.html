<div class="login-container">
  <app-toast-host />

  <canvas id="particle-canvas" class="bg-canvas"></canvas>

  <div class="login-content">

    <div class="login-box">
      <h2>I.E.S.P.P. <br>Virgen del Carmen</h2>

      <div class="input-group">
        <input [ngModel]="username()" (ngModelChange)="username.set($event)" placeholder="Usuario" autocomplete="username">
      </div>

      <div class="input-group password-group">
        <input [ngModel]="password()" (ngModelChange)="password.set($event)" [type]="showPassword() ? 'text' : 'password'" placeholder="Contraseña" autocomplete="current-password">
        <button type="button" class="toggle-btn" (click)="togglePassword()">
          <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
        </button>
      </div>

      <button (click)="login()">Iniciar Sesión</button>
    </div>

  </div>
</div>
