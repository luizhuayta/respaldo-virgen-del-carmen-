<div class="login-container">
  <app-toast-host />

  <canvas #particleCanvas class="bg-canvas" aria-hidden="true"></canvas>

  <div class="login-content">
    <form class="login-box" (ngSubmit)="login()" novalidate>
      <div class="login-logo-wrap">
        <img src="images/Logo.png" alt="Escudo del I.E.S.P.P. Virgen del Carmen" class="login-logo">
      </div>

      <header class="login-header">
        <h1>Panel de administración</h1>
        <p>I.E.S.P.P. Virgen del Carmen</p>
      </header>

      <div class="input-group">
        <label for="login-user">Usuario</label>
        <div class="field" [class.invalid]="showUserError()">
          <i class="fa-solid fa-user field-icon" aria-hidden="true"></i>
          <input
            #userInput
            id="login-user"
            name="username"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
            autocomplete="username"
            spellcheck="false"
            [disabled]="loading()"
            [attr.aria-invalid]="showUserError()"
            [attr.aria-describedby]="showUserError() ? 'user-error' : null"
          >
        </div>
        @if (showUserError()) {
          <p id="user-error" class="field-error">Ingrese su usuario</p>
        }
      </div>

      <div class="input-group">
        <label for="login-pass">Contraseña</label>
        <div class="field password-group" [class.invalid]="showPassError()">
          <i class="fa-solid fa-lock field-icon" aria-hidden="true"></i>
          <input
            id="login-pass"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            enterkeyhint="go"
            [disabled]="loading()"
            [attr.aria-invalid]="showPassError()"
            [attr.aria-describedby]="showPassError() ? 'pass-error' : null"
          >
          <button
            type="button"
            class="toggle-btn"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
          >
            <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'" aria-hidden="true"></i>
          </button>
        </div>
        @if (showPassError()) {
          <p id="pass-error" class="field-error">Ingrese su contraseña</p>
        }
      </div>

      <button type="submit" class="login-submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
          Iniciando sesión…
        } @else {
          Iniciar sesión
        }
      </button>

      <a routerLink="/inicio" class="back-link">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        Volver al sitio
      </a>
    </form>
  </div>
</div>
