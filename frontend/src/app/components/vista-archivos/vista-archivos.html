<div class="viewer-shell">
  <aside class="sidebar">
    @for (doc of documents(); track doc.id) {
      <button
        type="button"
        class="nav-item"
        [class.active]="activeId() === doc.id"
        (click)="selectDocument(doc.id)"
      >
        <span class="doc-label">{{ etiqueta(doc.label) }}</span>
      </button>
    }
  </aside>

  <section class="pdf-panel">
    @if (activeDocument(); as doc) {
      <app-lector-pdf [src]="doc.pdfUrl" [title]="etiqueta(doc.label)" />
    }
  </section>
</div>
