<main class="transparencia-detail-page">
  <section class="hero-component" aria-labelledby="horarios-title">
    <div class="hero-content">
      <div class="hero-badge">
        <i class="fa-solid fa-clock" aria-hidden="true"></i>
        <span>Transparencia Institucional</span>
      </div>
      <h1 id="horarios-title">Horarios Académicos y Turnos de Clase</h1>
      <p class="hero-subtitle">
        Programación horaria semestral, turnos de clase y distribución de aulas para todos los programas de
        estudios pedagógicos.
      </p>
    </div>
  </section>

  <section class="contenedor-pdf" aria-label="Documentos de horarios académicos">
    <app-vista-archivos [documents]="horariosDocs()"></app-vista-archivos>
  </section>
</main>
