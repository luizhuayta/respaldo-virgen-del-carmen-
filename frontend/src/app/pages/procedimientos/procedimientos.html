<main class="transparencia-detail-page">
  <section class="hero-component" aria-labelledby="procedimientos-title">
    <div class="hero-content">
      <div class="hero-badge">
        <i class="fa-solid fa-file-contract" aria-hidden="true"></i>
        <span>Transparencia Institucional</span>
      </div>
      <h1 id="procedimientos-title">Procedimientos y Trámites Académicos</h1>
      <p class="hero-subtitle">
        Guías oficiales, requisitos, formatos y flujos para la obtención de grados, títulos, traslados,
        convalidaciones y certificaciones en el I.E.S.P.P. Virgen del Carmen.
      </p>
    </div>
  </section>

  <section class="contenedor-pdf" aria-label="Documentos de procedimientos institucionales">
    <app-vista-archivos [documents]="procedimientosDocs()"></app-vista-archivos>
  </section>
</main>
